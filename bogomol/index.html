<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARKET NPC DEMO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game">
        <header class="topbar">
            <div>
                <h1>Рынок</h1>
                <small>(Для работоспособности рынка необходимо включить английскую раскладку)</small>
            </div>
            <div class="day">☀ День 1 · 10:24</div>
        </header>

        <div class="game-area">
            <canvas id="game" width="960" height="560"></canvas>

            <div class="dialogue" id="dialogue">
                <div class="speaker" id="speaker"></div>
                <div id="dialogueText"></div>
                <div class="hint">E / ENTER — продолжить</div>
            </div>
        </div>

        <footer>
            <div id="status">Исследуйте рынок и познакомьтесь с жителями.</div>
            <div class="controls">
                WASD / стрелки — движение<br>
                E — взаимодействие · ESC — закрыть
            </div>
        </footer>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
